<div class="flex gap-4 p-2 bg-gray-100 min-h-screen">
  @for (column of columns; track column.id) {
    <app-column-task [column]="column"> </app-column-task>
  }

  <div>
    @if (!isAddingColumn) {
      <button
        class="bg-white text-sm hover:bg-gray-200 p-2 rounded text-left shadow"
        (click)="openColumEditor()"
      >
        + Añadir lista
      </button>
    }
  </div>

    @if (isAddingColumn) {
      <div class="flex flex-col gap-2 p-2 bg-white rounded text-left shadow">
        <form [formGroup]="form" class="space-y-4">
          <textarea
            formControlName="title"
            placeholder="Introduce el titulo de la tarea..."
            class="border rounded p-2 resize-none"
          >
          </textarea>
          @if (form.controls.title.touched && form.controls.title.invalid) {
            <p class="text-red-500 text-sm mt-1">
              @if (form.controls.title.errors?.['required']) {
                titulo requerido
              }
            </p>
          }
          <div class="flex gap-2">
            <button (click)="addColum()" class="bg-green-600 text-white px-3 py-1 rounded">
              Añadir tarea
            </button>

            <button (click)="cancelColum()" class="bg-red-600 text-white px-3 py-1 rounded">
              Cancelar
            </button>
          </div>
        </form>
      </div>
    }
  </div>
